<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord OAuth Callback</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #07090f;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }
        .card {
            width: min(600px, 90%);
            padding: 32px;
            border-radius: 24px;
            background: rgba(10, 14, 39, 0.95);
            box-shadow: 0 25px 80px rgba(0,0,0,0.35);
        }
        h1 {
            margin-bottom: 16px;
            font-size: 28px;
        }
        p {
            margin-bottom: 10px;
            color: #cbd5e1;
            line-height: 1.7;
        }
        .success {
            color: #22c55e;
            font-weight: 700;
        }
        .error {
            color: #f97316;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Redireccionando...</h1>
        <div id="message">
            <p>Procesando el inicio de sesión con Discord.</p>
        </div>
    </div>

    <script>
        function parseParams() {
            const hash = window.location.hash.substring(1);
            const hashParams = new URLSearchParams(hash);
            const queryParams = new URLSearchParams(window.location.search);
            return {
                accessToken: hashParams.get('access_token') || queryParams.get('access_token'),
                tokenType: hashParams.get('token_type') || queryParams.get('token_type'),
                state: hashParams.get('state') || queryParams.get('state'),
                code: queryParams.get('code'),
                error: hashParams.get('error') || queryParams.get('error'),
                errorDescription: hashParams.get('error_description') || queryParams.get('error_description')
            };
        }

        function showMessage(html) {
            document.getElementById('message').innerHTML = html;
        }

        async function fetchDiscordUser(token) {
            const response = await fetch('https://discord.com/api/users/@me', {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            });
            if (!response.ok) {
                throw new Error('No se pudo obtener la información de Discord.');
            }
            return response.json();
        }

        async function processLogin() {
            const params = parseParams();
            const { accessToken, state: currentState, errorDescription, code } = params;
            const storedState = localStorage.getItem('discord_oauth_state');

            // Mostrar información inicial de depuración mínima
            showMessage('<p>Procesando el inicio de sesión con Discord...</p>');

            if (!accessToken) {
                if (code) {
                    showMessage('<p class="error">Se recibió un código de autorización (response_type=code).</p><p>Este flujo requiere un backend para intercambiar el código por un token.</p>');
                    return;
                }
                const reason = errorDescription || 'No se recibió el token de Discord.';
                showMessage(`<p class="error">${reason}</p><p>Asegúrate de haber configurado correctamente el redirect URI en la aplicación de Discord.</p>`);
                return;
            }

            if (storedState && storedState !== currentState) {
                showMessage('<p class="error">Error de seguridad OAuth.</p><p>El estado recibido no coincide. Intenta iniciar sesión nuevamente.</p>');
                return;
            }

            localStorage.removeItem('discord_oauth_state');

            try {
                showMessage('<p>Cargando datos de Discord...</p>');
                const user = await fetchDiscordUser(accessToken);
                const username = `${user.username}#${user.discriminator}`;
                const days = localStorage.getItem('creativosDiscordDays') || '46';
                let avatarUrl = '';

                if (user.avatar) {
                    const extension = user.avatar.startsWith('a_') ? 'gif' : 'png';
                    avatarUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${extension}?size=128`;
                }

                localStorage.setItem('creativosDiscordUser', username);
                localStorage.setItem('creativosDiscordUsername', user.username);
                localStorage.setItem('creativosDiscordId', user.id);
                localStorage.setItem('creativosDiscordEmail', user.email || 'No especificado');
                localStorage.setItem('creativosDiscordDays', days);
                localStorage.setItem('creativosDiscordToken', accessToken);
                if (avatarUrl) {
                    localStorage.setItem('creativosDiscordAvatar', avatarUrl);
                }

                showMessage('<p class="success">¡Inicio de sesión exitoso!</p><p>Redirigiendo al dashboard...</p>');
                setTimeout(() => {
                    window.location.href = 'https://jaxpr01.github.io/underwaterrp/dashboard.html';
                }, 1200);
            } catch (error) {
                // Si la petición a la API falla (CORS o similar), aún guardamos el token y redirigimos.
                console.warn('fetchDiscordUser error:', error);
                localStorage.setItem('creativosDiscordToken', accessToken);
                showMessage('<p class="error">No fue posible obtener los datos de Discord (posible CORS).</p><p>Redirigiendo al dashboard y continuando localmente...</p>');
                setTimeout(() => {
                    window.location.href = 'https://jaxpr01.github.io/underwaterrp/dashboard.html';
                }, 1400);
            }
        }

        processLogin();
    </script>
</body>
</html>
